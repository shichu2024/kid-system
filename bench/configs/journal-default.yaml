# bench/configs/journal-default.yaml
# Config for SkillOpt eval of the kid-journal skill (v1.2: pure eval, no training).
# Consumed by bench/run_eval.py (standalone) or skillopt-train (registered).
#
# Run:
#   python bench/run_eval.py --skill journal --split val

env: kidsys_journal

data:
  data_root: bench/cases/journal/
  split_mode: ratio            # single items.json → auto-split
  split_ratio: "3:1:1"         # train:val:test
  split_seed: 42
  task_type: journal

model:
  backend: chat                # chat backend (set SKILLOPT_BACKEND in .env)
  max_completion_tokens: 4096

train:
  epochs: 0                    # v1.2: no optimizer — eval harness only
  batchsize: 8

gate:
  enabled: false               # v1.2: pure evaluation, no regression gate

output:
  out_dir: bench/reports/
  deploy_skill: false          # NEVER auto-deploy; human review only
